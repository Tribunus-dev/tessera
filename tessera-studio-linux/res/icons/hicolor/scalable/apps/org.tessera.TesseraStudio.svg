<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Tessera Studio</title>
<!-- Adwaita palette only — no purple gradient, taste: system window_bg + accent blue -->
<rect width="512" height="512" rx="96" fill="#f6f5f4"/>
<!-- tessera mosaic 3x3 — slightly irregular, hints at knowledge graph -->
<g fill="#3584e4" opacity="0.95">
  <rect x="56" y="56" width="118" height="118" rx="14"/>
  <rect x="197" y="56" width="118" height="118" rx="14"/>
  <rect x="338" y="56" width="118" height="118" rx="14"/>
  <rect x="56" y="197" width="118" height="118" rx="14"/>
  <rect x="197" y="197" width="118" height="118" rx="14" fill="#1c71d8"/>
  <rect x="338" y="197" width="118" height="118" rx="14"/>
  <rect x="56" y="338" width="118" height="118" rx="14"/>
  <rect x="197" y="338" width="118" height="118" rx="14"/>
  <rect x="338" y="338" width="118" height="118" rx="14"/>
</g>
<!-- subtle grout lines -->
<g stroke="#ffffff" stroke-width="6" opacity="0.9">
  <line x1="185" y1="56" x2="185" y2="456"/>
  <line x1="326" y1="56" x2="326" y2="456"/>
  <line x1="56" y1="185" x2="456" y2="185"/>
  <line x1="56" y1="326" x2="456" y2="326"/>
</g>
<!-- center mark — receipt dot -->
<circle cx="256" cy="256" r="18" fill="#ffffff" stroke="#1c71d8" stroke-width="4"/>
</svg>
