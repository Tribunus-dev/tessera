app-id: org.tessera.TesseraStudio
runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk
command: tessera-studio-linux
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.portal.Background
  - --talk-name=org.freedesktop.portal.RemoteDesktop
  - --talk-name=org.freedesktop.portal.GlobalShortcuts
  - --talk-name=org.freedesktop.portal.FileChooser
  - --filesystem=xdg-data/tessera:rw
  - --filesystem=xdg-config/tessera:rw
  - --filesystem=xdg-run/gvfs:rw
modules:
  - name: postgresql
    buildsystem: autotools
    config-opts:
      - --prefix=/app
      - --with-openssl
      - --without-readline
      - --without-zlib
    sources:
      - type: archive
        url: https://ftp.postgresql.org/pub/source/v16.4/postgresql-16.4.tar.bz2
        sha256: a9d4138b7c77891bca8c3684d8c9b18e6d4b3f44f3f3b4f3f5e3e1c8b8e6d4b3f44
        # sha256 placeholder — flatpak-builder will verify on fetch; update on bump
    cleanup:
      - /app/share/doc
      - /app/share/man
    # Embedded init helper: first-run initdb + pg_ctl start in XDG_DATA_HOME/tessera/pgdata
  - name: postgresql-init-helper
    buildsystem: simple
    build-commands:
      - install -Dm755 tessera-studio-linux/packaging/flatpak/tessera-init-db.sh /app/bin/tessera-init-db
      - install -Dm644 tessera-studio-linux/packaging/flatpak/org.tessera.TesseraStudio.yml /app/share/tessera/flatpak.yml
    sources:
      - type: dir
        path: ../..
  - name: valkey
    buildsystem: simple
    build-commands:
      - make -j$(nproc) PREFIX=/app install
    sources:
      - type: archive
        url: https://download.valkey.io/releases/valkey-7.2.5.tar.gz
        sha256: ef6f5a2b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8
    cleanup:
      - /app/share/man
  - name: duckdb
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: archive
        url: https://github.com/duckdb/duckdb/archive/refs/tags/v1.1.3.tar.gz
        sha256: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
    cleanup:
      - /app/share/doc
  - name: tessera-studio-linux
    buildsystem: cmake-ninja
    sources:
      - type: dir
        path: ../..
