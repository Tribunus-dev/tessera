app-id: org.tessera.TesseraStudio
runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk
command: tessera-studio-linux
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-data/tessera:rw
  - --filesystem=xdg-config/tessera:rw
modules:
  - name: tessera-studio-linux
    buildsystem: cmake-ninja
    sources:
      - type: dir
        path: ../..
