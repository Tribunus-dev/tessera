app-id: org.tessera.TesseraStudio
runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk
command: tessera-studio-linux
# Base is enterprise (procurement first-class, eyes-off, no duress).
# Personal overlay: org.tessera.TesseraStudio.personal.yml adds
# --share=network + GlobalShortcuts/RemoteDesktop/Background.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.portal.FileChooser
  - --filesystem=xdg-data/tessera:rw
  - --filesystem=xdg-config/tessera:rw
  - --filesystem=xdg-run/gvfs:rw
modules:
  - name: postgresql
    buildsystem: autotools
    config-opts:
      - --prefix=/app
      - --with-openssl
      - --without-readline
      - --without-zlib
    sources:
      - type: archive
        url: https://ftp.postgresql.org/pub/source/v16.4/postgresql-16.4.tar.bz2
        sha256: 971766d645aa73e93b9ef4e3be44201b4f45b5477095b049125403f9f3386d6f
    cleanup:
      - /app/share/doc
      - /app/share/man
    # Embedded init helper: first-run initdb + pg_ctl start in XDG_DATA_HOME/tessera/pgdata
  - name: postgresql-init-helper
    buildsystem: simple
    build-commands:
      - install -Dm755 tessera-studio-linux/packaging/flatpak/tessera-init-db.sh /app/bin/tessera-init-db
      - install -Dm644 tessera-studio-linux/packaging/flatpak/org.tessera.TesseraStudio.yml /app/share/tessera/flatpak.yml
    sources:
      - type: dir
        path: ../..
  - name: valkey
    buildsystem: simple
    build-commands:
      - make -j$(nproc) PREFIX=/app install
    sources:
      - type: archive
        url: https://github.com/valkey-io/valkey/archive/refs/tags/7.2.5.tar.gz
        sha256: c7c7a758edabe7693b3692db58fe5328130036b06224df64ab1f0c12fe265a76
    cleanup:
      - /app/share/man
  - name: duckdb
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: archive
        url: https://github.com/duckdb/duckdb/archive/refs/tags/v1.1.3.tar.gz
        sha256: 2aea0af898ad753fee82b776fea1bf78ccbc9648986e7f7a87372df5e74cdb98
    cleanup:
      - /app/share/doc
  - name: tessera-studio-linux
    buildsystem: cmake-ninja
    sources:
      - type: dir
        path: ../..
