app-id: org.tessera.TesseraStudio.Enterprise
runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk
command: tessera-studio-linux
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.portal.FileChooser
  - --filesystem=xdg-data/tessera:rw
  - --filesystem=xdg-config/tessera:rw
  - --filesystem=xdg-run/gvfs:rw
