<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Tessera — Private local AI that gets better the more people use it.">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#0a0a10"/>
<stop offset="100%" stop-color="#131320"/>
</linearGradient>
<linearGradient id="cyanFade" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#6ad4ff" stop-opacity="0.95"/>
<stop offset="100%" stop-color="#6ad4ff" stop-opacity="0.15"/>
</linearGradient>
<linearGradient id="magentaFade" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#c56ad4" stop-opacity="0.15"/>
<stop offset="100%" stop-color="#c56ad4" stop-opacity="0.95"/>
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#6ad4ff" stop-opacity="0.20"/>
<stop offset="100%" stop-color="#6ad4ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/>
<rect width="1280" height="640" fill="url(#glow)"/>

<!-- Subtle grid -->
<g stroke="#1c1c2e" stroke-width="1" opacity="0.6">
<line x1="0" y1="160" x2="1280" y2="160"/>
<line x1="0" y1="320" x2="1280" y2="320"/>
<line x1="0" y1="480" x2="1280" y2="480"/>
<line x1="320" y1="0" x2="320" y2="640"/>
<line x1="640" y1="0" x2="640" y2="640"/>
<line x1="960" y1="0" x2="960" y2="640"/>
</g>

<!-- Prism dispersion mark, left side -->
<g transform="translate(140, 320)">
<polygon points="-60,-50 60,-50 0,80" fill="none" stroke="#2a2a3e" stroke-width="1.5"/>
<line x1="-90" y1="-30" x2="-60" y2="-50" stroke="#a0a0b8" stroke-width="1" opacity="0.6"/>
<line x1="0" y1="80" x2="0" y2="120" stroke="#a0a0b8" stroke-width="1" opacity="0.6"/>
<line x1="-30" y1="15" x2="60" y2="80" stroke="url(#cyanFade)" stroke-width="2"/>
<line x1="0" y1="20" x2="80" y2="80" stroke="url(#magentaFade)" stroke-width="2"/>
<line x1="30" y1="15" x2="100" y2="80" stroke="#c56ad4" stroke-width="1.5" opacity="0.7"/>
</g>

<!-- Title -->
<text x="320" y="280" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="68" font-weight="700" fill="#ebebf2" letter-spacing="-1.5">Tessera</text>

<!-- Tagline -->
<text x="320" y="350" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#a0a0b8" letter-spacing="-0.5">Private local AI that gets better</text>
<text x="320" y="388" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#a0a0b8" letter-spacing="-0.5">the more people use it.</text>

<!-- Subline -->
<text x="320" y="450" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#6c6c84" letter-spacing="2">GEMMA 4 12B · QWEN 3 TTS · ANE PREFILL · LOCAL FLYWHEEL</text>

<!-- Domain -->
<text x="320" y="540" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#6ad4ff" letter-spacing="0.5">tessera.tribunus.dev</text>

<!-- Right rule, accent -->
<line x1="1180" y1="120" x2="1180" y2="520" stroke="#6ad4ff" stroke-width="2"/>
</svg>
